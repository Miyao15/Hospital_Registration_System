server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hospital_registration?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=30000
    username: root
    # FIXME: 请在这里填入您自己本地 MySQL 数据库 `root` 用户的正确密码
    password: "Hu060215"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000  # 连接超时时间（毫秒）
      maximum-pool-size: 10      # 最大连接数
      minimum-idle: 5             # 最小空闲连接数
      idle-timeout: 600000        # 空闲连接超时时间（10分钟）
      max-lifetime: 1800000       # 连接最大生存时间（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值
  
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: always  # 改为 always，每次启动时自动执行 schema.sql（使用 CREATE TABLE IF NOT EXISTS 确保安全）
      encoding: UTF-8  # 明确指定 SQL 脚本文件的字符编码为 UTF-8
      schema-locations: classpath:schema.sql
      data-locations: 
        - classpath:01_add_examination_items.sql  # 初始化数据脚本
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  servlet:
    multipart:
      max-file-size: 5MB  # 单个文件最大大小
      max-request-size: 10MB  # 请求最大大小

jwt:
  secret: ThisIsAReallyLongAndStrongSecretKeyForAccessTokensThatShouldBeChangedInProduction1234567890ABCDEF
  refresh-secret: ThisIsAnotherReallyLongAndStrongSecretKeyForRefreshTokensThatShouldBeChangedInProductionABCDEF0987654321
  access-expiration: 7200000  # 2 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

app:
  security:
    max-login-failures: 5
    lock-duration-minutes: 30
    verification-code-ttl: 300  # 5 minutes in seconds
    admin-registration-key: "YOUR_SECRET_ADMIN_KEY"
  upload:
    dir: ./uploads  # 文件上传目录
    url-prefix: /uploads  # 文件访问URL前缀
    max-size: 5242880  # 最大文件大小（5MB）
